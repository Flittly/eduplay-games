<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 纸墨拼贴 · 寰宇地球仪 · 玄青 -->
  <rect x="9" y="11" width="104" height="104" rx="14" fill="#2b2620"/>
  <rect x="6" y="6" width="104" height="104" rx="14" fill="#f7f1e3" stroke="#2b2620" stroke-width="3"/>
  <!-- 深空背景 -->
  <circle cx="58" cy="60" r="38" fill="#12203a" stroke="#2b2620" stroke-width="3"/>
  <!-- 星星 -->
  <circle cx="90" cy="30" r="1.6" fill="#f7f1e3"/>
  <circle cx="97" cy="48" r="1.1" fill="#f7f1e3" opacity="0.8"/>
  <circle cx="86" cy="86" r="1.3" fill="#f7f1e3" opacity="0.9"/>
  <circle cx="24" cy="80" r="1.2" fill="#f7f1e3" opacity="0.7"/>
  <!-- 大陆剪影 -->
  <path d="M44 42 q9 -9 20 -5 q9 4 6 12 q-3 9 -13 10 q-11 1 -14 -7 q-2 -6 1 -10 z" fill="#3f6b4f" opacity="0.92"/>
  <path d="M62 62 q10 -3 15 4 q4 6 -2 12 q-8 7 -16 2 q-7 -5 -3 -12 q2 -4 6 -6 z" fill="#3f6b4f" opacity="0.85"/>
  <path d="M36 58 q6 -2 9 3 q2 5 -3 8 q-6 3 -9 -2 q-2 -6 3 -9 z" fill="#3f6b4f" opacity="0.8"/>
  <!-- 经线 -->
  <ellipse cx="58" cy="60" rx="14" ry="38" fill="none" stroke="#c9a84c" stroke-width="1.6" opacity="0.85"/>
  <ellipse cx="58" cy="60" rx="27" ry="38" fill="none" stroke="#c9a84c" stroke-width="1.4" opacity="0.65"/>
  <!-- 赤道 -->
  <ellipse cx="58" cy="60" rx="38" ry="11" fill="none" stroke="#e05d4f" stroke-width="2.4"/>
  <!-- 南北回归线 -->
  <ellipse cx="58" cy="49" rx="34.7" ry="9.6" fill="none" stroke="#e0a83c" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="58" cy="71" rx="34.7" ry="9.6" fill="none" stroke="#e0a83c" stroke-width="1.5" opacity="0.9"/>
  <!-- 地轴 -->
  <line x1="58" y1="18" x2="58" y2="102" stroke="#f2e8d5" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- 极点标注 -->
  <text x="58" y="13" font-family="'Yuanti SC','Microsoft YaHei',sans-serif" font-size="10" fill="#33608c" font-weight="bold" text-anchor="middle">N</text>
  <text x="58" y="112" font-family="'Yuanti SC','Microsoft YaHei',sans-serif" font-size="10" fill="#33608c" font-weight="bold" text-anchor="middle">S</text>
  <!-- 印章 -->
  <rect x="82" y="82" width="22" height="22" rx="4" fill="#33608c" stroke="#2b2620" stroke-width="2.5"/>
  <text x="93" y="99" font-family="'Kaiti SC','STKaiti',KaiTi,serif" font-size="15" fill="#fdf8ec" text-anchor="middle" font-weight="bold">寰</text>
</svg>
