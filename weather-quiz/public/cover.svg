<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 纸墨拼贴 · 气象要素识别 · 藏青 -->
  <rect x="9" y="11" width="104" height="104" rx="14" fill="#2b2620"/>
  <rect x="6" y="6" width="104" height="104" rx="14" fill="#f7f1e3" stroke="#2b2620" stroke-width="3"/>

  <!-- 太阳（右上，一角被云遮住） -->
  <g stroke="#2b2620" stroke-width="2.6" stroke-linecap="round">
    <line x1="101" y1="34" x2="106" y2="34"/>
    <line x1="96.6" y1="23.4" x2="100.1" y2="19.9"/>
    <line x1="96.6" y1="44.6" x2="100.1" y2="48.1"/>
    <line x1="86" y1="19" x2="86" y2="14"/>
    <line x1="86" y1="49" x2="86" y2="54"/>
    <line x1="75.4" y1="23.4" x2="71.9" y2="19.9"/>
    <line x1="71" y1="34" x2="66" y2="34"/>
  </g>
  <circle cx="86" cy="34" r="11" fill="#d4a843" stroke="#2b2620" stroke-width="2.6"/>

  <!-- 云 -->
  <path
    d="M30,74 C20,74 16,64 22,57 C20,46 32,38 42,44 C48,33 68,34 72,46 C84,44 92,54 88,63 C94,66 92,74 84,74 Z"
    fill="#cfc7b6" stroke="#2b2620" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 斜雨点（阵雨） -->
  <g stroke="#2d6ca8" stroke-width="3.4" stroke-linecap="round">
    <line x1="46" y1="81" x2="42" y2="89"/>
    <line x1="60" y1="81" x2="56" y2="89"/>
    <line x1="74" y1="81" x2="70" y2="89"/>
  </g>

  <!-- 问号印章 -->
  <rect x="16" y="78" width="22" height="22" fill="#cc0000" stroke="#2b2620" stroke-width="2.4"/>
  <text x="27" y="95" font-family="'Arial Black','Microsoft YaHei',sans-serif" font-size="17"
        fill="#fdf8ec" text-anchor="middle" font-weight="bold">?</text>
</svg>
