<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 纸墨拼贴 · 寰宇太阳系 · 曜紫 -->
  <rect x="9" y="11" width="104" height="104" rx="14" fill="#2b2620"/>
  <rect x="6" y="6" width="104" height="104" rx="14" fill="#f7f1e3" stroke="#2b2620" stroke-width="3"/>
  <!-- 深空 -->
  <circle cx="58" cy="60" r="38" fill="#0d1730" stroke="#2b2620" stroke-width="3"/>
  <!-- 星星 -->
  <circle cx="30" cy="30" r="1.5" fill="#f7f1e3"/>
  <circle cx="93" cy="34" r="1.2" fill="#f7f1e3" opacity="0.85"/>
  <circle cx="88" cy="78" r="1.4" fill="#f7f1e3" opacity="0.9"/>
  <circle cx="27" cy="80" r="1.1" fill="#f7f1e3" opacity="0.7"/>
  <circle cx="70" cy="24" r="1" fill="#f7f1e3" opacity="0.6"/>
  <!-- 轨道 -->
  <ellipse cx="54" cy="60" rx="15" ry="15" fill="none" stroke="#8fb6ff" stroke-width="1" opacity="0.55"/>
  <ellipse cx="54" cy="60" rx="23" ry="23" fill="none" stroke="#8fb6ff" stroke-width="1" opacity="0.45"/>
  <ellipse cx="54" cy="60" rx="32" ry="32" fill="none" stroke="#8fb6ff" stroke-width="1" opacity="0.35"/>
  <!-- 太阳 -->
  <circle cx="54" cy="60" r="9" fill="#ffcf4a" stroke="#2b2620" stroke-width="2.2"/>
  <circle cx="54" cy="60" r="13" fill="none" stroke="#ffb02e" stroke-width="1.4" opacity="0.55"/>
  <line x1="54" y1="42" x2="54" y2="46" stroke="#ffb02e" stroke-width="1.6"/>
  <line x1="54" y1="74" x2="54" y2="78" stroke="#ffb02e" stroke-width="1.6"/>
  <line x1="36" y1="60" x2="40" y2="60" stroke="#ffb02e" stroke-width="1.6"/>
  <line x1="68" y1="60" x2="72" y2="60" stroke="#ffb02e" stroke-width="1.6"/>
  <!-- 行星 -->
  <circle cx="69" cy="60" r="3.4" fill="#c1502e" stroke="#2b2620" stroke-width="1.6"/>
  <circle cx="54" cy="37" r="4.2" fill="#3d7ec4" stroke="#2b2620" stroke-width="1.6"/>
  <!-- 土星与光环 -->
  <ellipse cx="31" cy="79" rx="8" ry="2.6" fill="none" stroke="#e3d3a3" stroke-width="2.4" opacity="0.95"/>
  <circle cx="31" cy="79" r="4" fill="#e3d3a3" stroke="#2b2620" stroke-width="1.6"/>
  <!-- 小行星带 -->
  <circle cx="76" cy="44" r="0.9" fill="#b9ae9d"/>
  <circle cx="82" cy="52" r="0.8" fill="#b9ae9d"/>
  <circle cx="80" cy="68" r="0.9" fill="#b9ae9d"/>
  <circle cx="72" cy="78" r="0.8" fill="#b9ae9d"/>
  <circle cx="25" cy="45" r="0.8" fill="#b9ae9d"/>
  <!-- 印章 -->
  <rect x="82" y="82" width="22" height="22" rx="4" fill="#6b4fa8" stroke="#2b2620" stroke-width="2.5"/>
  <text x="93" y="99" font-family="'Kaiti SC','STKaiti',KaiTi,serif" font-size="15" fill="#fdf8ec" text-anchor="middle" font-weight="bold">系</text>
</svg>
