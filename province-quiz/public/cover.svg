<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 纸墨拼贴 · 省级行政区识别 · 竹绿 -->
  <rect x="9" y="11" width="104" height="104" rx="14" fill="#2b2620"/>
  <rect x="6" y="6" width="104" height="104" rx="14" fill="#f7f1e3" stroke="#2b2620" stroke-width="3"/>
  <!-- 省区轮廓（简化省界形状） -->
  <path d="M26,64 L34,44 L48,38 L58,42 L64,34 L76,36 L82,46 L78,58 L86,66 L80,80 L64,86 L48,82 L34,84 L26,72 Z"
        fill="#3a9d6e" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>
  <path d="M48,38 L52,56 L44,66 M64,34 L62,52 L74,58"
        stroke="#f7f1e3" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round" fill="none"/>
  <!-- 问号 -->
  <text x="88" y="52" font-family="'Yuanti SC','Microsoft YaHei',sans-serif" font-size="34" fill="#c94f43"
        text-anchor="middle" font-weight="bold" stroke="#2b2620" stroke-width="1.2" paint-order="stroke">?</text>
  <!-- 答对的对勾印章 -->
  <rect x="82" y="14" width="22" height="22" rx="4" fill="#3a9d6e" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M86,25 L91,30 L100,19" stroke="#fdf8ec" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
