<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 纸墨拼贴 · 省级行政区识别 · 竹绿 -->
  <rect x="9" y="11" width="104" height="104" rx="14" fill="#2b2620"/>
  <rect x="6" y="6" width="104" height="104" rx="14" fill="#f7f1e3" stroke="#2b2620" stroke-width="3"/>
  <!-- 省区轮廓（居中，简化省界形状） -->
  <path d="M30,62 L36,42 L50,34 L64,36 L72,30 L84,38 L88,52 L82,64 L88,72 L80,84 L66,90 L50,88 L36,88 L28,76 Z"
        fill="#3a9d6e" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50,34 L54,52 L46,62 L60,70 L70,64"
        stroke="#f7f1e3" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round" fill="none"/>
  <!-- 问号（居中于轮廓内，贴合“看轮廓猜省名”玩法） -->
  <text x="57" y="76" font-family="'Yuanti SC','Microsoft YaHei',sans-serif" font-size="46"
        fill="#fdf8ec" stroke="#2b2620" stroke-width="2" paint-order="stroke"
        text-anchor="middle" font-weight="bold">?</text>
  <!-- 答对的对勾印章（右下角，与轮廓、问号互不遮挡） -->
  <rect x="86" y="86" width="24" height="24" rx="5" fill="#c94f43" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M91,98 L96,103 L105,90" stroke="#fdf8ec" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
